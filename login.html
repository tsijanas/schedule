<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule — Sign in</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFE13B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --paper:#F7F7F7; --ink:#004654; --ink-soft:#1D4249; --ink-faint:#4A6167;
    --line:rgba(0,70,84,0.22); --gold:#FFE13B; --sidebar:#004654; --sidebar-ink:#EDFFE9;
    --brick:#FFA580; --brick-soft:#FFD2BF; --brick-text:#8A3A1E;
    --radius:16px; --shadow: 0 2px 4px rgba(0,70,84,0.10), 0 8px 24px rgba(0,70,84,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; font-size:14px;
    -webkit-font-smoothing:antialiased; display:flex; align-items:center; justify-content:center; min-height:100%;
    padding:20px;
  }
  h1,.serif{ font-family:'Fraunces',Georgia,serif; }
  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:32px 30px; width:360px; max-width:100%;
  }
  .brand{ display:flex; align-items:center; gap:8px; margin-bottom:22px; }
  .brand svg{ width:30px; height:20px; flex-shrink:0; }
  .brand-name{ font-family:'Fraunces',serif; font-weight:600; font-size:21px; color:var(--ink); }

  h1{ font-size:20px; margin:0 0 4px 0; font-weight:600; }
  .sub{ color:var(--ink-soft); font-size:12.5px; margin:0 0 22px 0; line-height:1.5; }

  .btn-google{
    width:100%; margin-top:6px; padding:11px 14px; border-radius:10px; border:1px solid var(--line);
    background:#fff; color:var(--ink); font-weight:600; font-size:13.5px;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn-google:hover{ background:var(--paper); }
  .btn-google:disabled{ opacity:0.6; cursor:default; }
  .btn-google svg{ width:18px; height:18px; flex-shrink:0; }

  .error{
    display:none; margin-top:14px; background:var(--brick-soft); color:var(--brick-text);
    border:1px solid var(--brick); border-radius:8px; padding:9px 11px; font-size:12.5px; font-weight:500;
  }
  .error.show{ display:block; }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <svg viewBox="0 0 50 30" xmlns="http://www.w3.org/2000/svg"><rect width="50" height="30" rx="6" fill="#004654"/><circle cx="15" cy="15" r="5" fill="#EDFFE9"/><circle cx="31" cy="15" r="5" fill="#FFE13B"/></svg>
    <div class="brand-name">Schedule</div>
  </div>

  <h1 id="form-title">Sign in</h1>
  <p class="sub" id="form-sub">Sign in with your work Google account to see your schedule.</p>

  <button type="button" class="btn-google" id="btn-google">
    <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/>
      <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
    </svg>
    <span id="btn-google-label">Sign in with Google</span>
  </button>

  <div class="error" id="form-error"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDSMLKjzO0D_sZLG-0o3lcx2M-sBZOx7xs",
    authDomain: "schedule-75592.firebaseapp.com",
    projectId: "schedule-75592",
    storageBucket: "schedule-75592.firebasestorage.app",
    messagingSenderId: "462168002601",
    appId: "1:462168002601:web:b070d152e9ac270b9fcc38"
  };
  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const provider = new GoogleAuthProvider();
  // Nudges Google to show the account picker rather than silently reusing whichever Google
  // account happens to already be signed in on this device — matters a lot here, since people
  // often have several Google accounts and picking the wrong one would fail the invite match.
  provider.setCustomParameters({ prompt: 'select_account' });

  // Already signed in? Skip straight to the app — index.html sorts out whether this account
  // is approved yet or still needs an invite.
  onAuthStateChanged(auth, (user)=>{ if(user) window.location.replace('index.html'); });

  // Arrived via an invite link? A personal link names exactly who this was sent to. Can't
  // lock anything the way a pre-filled email field used to — there's no field anymore — but
  // it can still tell someone which Google account to actually pick if they have more than
  // one, before they click through and possibly choose the wrong one.
  const params = new URLSearchParams(window.location.search);
  const inviteEmail = params.get('invite_email');
  if(inviteEmail){
    document.getElementById('form-title').textContent = "You're invited";
    document.getElementById('form-sub').textContent = `Sign in with the Google account for ${inviteEmail} — you'll see your schedule right away, no waiting on approval.`;
  }

  function friendlyError(code){
    const map = {
      'auth/popup-closed-by-user': '', // they cancelled — no error needed, just let them try again
      'auth/popup-blocked': 'Your browser blocked the sign-in popup. Check your popup blocker and try again.',
      'auth/cancelled-popup-request': '',
      'auth/network-request-failed': 'Network problem — check your connection and try again.',
    };
    return code in map ? map[code] : 'Something went wrong signing in. Please try again.';
  }

  const googleBtn = document.getElementById('btn-google');
  const googleLabel = document.getElementById('btn-google-label');
  const errorBox = document.getElementById('form-error');
  googleBtn.addEventListener('click', async ()=>{
    errorBox.classList.remove('show');
    googleBtn.disabled = true;
    googleLabel.textContent = 'Signing in…';
    try{
      await signInWithPopup(auth, provider);
      window.location.replace('index.html');
    }catch(err){
      console.error(err);
      const msg = friendlyError(err.code);
      if(msg){ errorBox.textContent = msg; errorBox.classList.add('show'); }
      googleBtn.disabled = false;
      googleLabel.textContent = 'Sign in with Google';
    }
  });
</script>
</body>
</html>
