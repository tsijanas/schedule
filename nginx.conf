server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # ---- Compression ----
    # index.html is ~530 KB of inline CSS/JS (no build step to split it), which gzip takes
    # down to ~130 KB. Without this every visitor downloads the full half-megabyte.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               image/svg+xml application/manifest+json;
    # text/html is always gzipped by nginx when gzip is on; it isn't listed in gzip_types.

    # ---- Security headers ----
    # Note on script-src 'unsafe-inline': the app's <script type="module"> blocks are written
    # directly in the HTML (no build step to move them to separate files and hash them), so a
    # strict CSP isn't possible without a larger rework. This is a known, accepted trade-off —
    # the real security boundary for this app is the Firestore security rules (who can read/
    # write what), not the browser sandbox. Worth revisiting if this app grows a build step.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Report-Only, deliberately, and this is the reason:
    #
    # Until the cache-header fix, an add_header inside the .html location was replacing the
    # inherited headers, so this policy never actually reached an HTML page — it had been
    # written but never enforced. Fixing that turned it on for the first time, and it was
    # missing a host that Google sign-in needs: the Firebase auth SDK injects
    # https://apis.google.com/js/api.js to run its auth iframe, and asserts the resulting
    # `gapi` global exists or throws auth/internal-error. script-src blocked the script, so
    # signing in failed with exactly that error.
    #
    # The missing hosts are added below, but the policy has never been exercised against the
    # real sign-in flow, so it reports instead of blocking: a mistake here locks everyone out
    # of the tool. Sign in once, read any "[Report Only] Refused to…" lines in the browser
    # console, add whatever they name, and only then rename this header back to
    # Content-Security-Policy.
    add_header Content-Security-Policy-Report-Only "
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https://lh3.googleusercontent.com;
        connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com wss://*.firebaseio.com https://date.nager.at https://apis.google.com;
        frame-src 'self' https://*.firebaseapp.com https://apis.google.com https://accounts.google.com;
    " always;

    # Caching is set with `expires`, not `add_header Cache-Control`, and that is deliberate:
    # an add_header inside a location REPLACES the ones inherited from the server block rather
    # than adding to them. Setting the cache header that way silently dropped the CSP,
    # X-Frame-Options, nosniff and Referrer-Policy from every .html response — the one place
    # they matter most. `expires` sets the cache headers through a different mechanism, so the
    # security headers above still apply.
    #
    # HTML is never cached, so a deploy is visible immediately (there are no build hashes to
    # bust a cache with, since there's no build step).
    location ~* \.html$ {
        expires -1;
    }

    # The manifest decides the installed app's name and icon, so it must not be served stale
    # after a change. The icons themselves are stable and can be cached for a day.
    location = /manifest.json {
        expires -1;
    }
    location ~* \.(png|ico|svg)$ {
        expires 1d;
    }

    # The bare domain is what people actually open, and it was the one URL with no cache rule
    # at all: with no Cache-Control a browser is free to guess how long to keep it, which is
    # why a deploy could need a hard refresh before it showed up.
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Don't leak server details
    server_tokens off;
}
