server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # ---- Security headers ----
    # Note on script-src 'unsafe-inline': the app's <script type="module"> blocks are written
    # directly in the HTML (no build step to move them to separate files and hash them), so a
    # strict CSP isn't possible without a larger rework. This is a known, accepted trade-off —
    # the real security boundary for this app is the Firestore security rules (who can read/
    # write what), not the browser sandbox. Worth revisiting if this app grows a build step.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com wss://*.firebaseio.com https://date.nager.at;
        frame-src https://*.firebaseapp.com;
    " always;

    # HTML files: never cache, so a deploy is visible immediately (no build hashes to bust
    # a cache with, since there's no build step)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Don't leak server details
    server_tokens off;
}
